# nginx of the "rutaviva" container (https://rutaviva.aminox.dev, behind Nginx Proxy Manager).
# Serves the static site, the self-hosted map tiles (PMTiles, range requests), the live layers the
# worker writes, and proxies: worker API, Valhalla routing, DGT camera images / pictograms (cached,
# so the DGT gets at most one request per image every 2 minutes) and the CartoCiudad geocoder.
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    types {
        application/manifest+json webmanifest;
        application/x-protobuf pbf;
        application/vnd.pmtiles pmtiles;
        text/javascript mjs;
    }
    # NPM already logs requests in front of this container; keep no second copy here.
    access_log off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    absolute_redirect off;
    charset utf-8;
    charset_types text/css text/plain application/javascript application/json image/svg+xml application/manifest+json;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json application/xml application/x-protobuf;
    gzip_min_length 1024;

    resolver 127.0.0.11 valid=300s ipv6=off;

    upstream dgt {
        zone dgt 64k;
        server etraffic.dgt.es:443 resolve max_fails=0;
        keepalive 8;
    }
    upstream cartociudad {
        zone cartociudad 64k;
        server www.cartociudad.es:443 resolve max_fails=0;
        keepalive 4;
    }
    upstream worker {
        zone worker 64k;
        server rutaviva-worker:8080 resolve max_fails=0;
        keepalive 8;
    }
    upstream valhalla {
        zone valhalla 64k;
        server rutaviva-valhalla:8002 resolve max_fails=0;
        keepalive 4;
    }

    # Caches inside the container (regenerable, no backup needed).
    proxy_cache_path /var/cache/nginx/cam levels=1:2 keys_zone=camcache:16m max_size=1g inactive=1d use_temp_path=off;
    proxy_cache_path /var/cache/nginx/geo levels=1:2 keys_zone=geocache:8m max_size=200m inactive=14d use_temp_path=off;
    proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=apicache:8m max_size=300m inactive=1d use_temp_path=off;

    # The visitor's address as seen by Cloudflare / NPM, only for rate limiting (never logged here).
    map $http_cf_connecting_ip $client {
        "" $http_x_real_ip;
        default $http_cf_connecting_ip;
    }
    map $client $client_key {
        "" $remote_addr;
        default $client;
    }
    limit_req_zone $client_key zone=tiles:20m rate=120r/s;
    limit_req_zone $client_key zone=cams:10m rate=8r/s;
    limit_req_zone $client_key zone=api:10m rate=10r/s;
    limit_req_zone $client_key zone=route:10m rate=1r/s;
    limit_req_zone $client_key zone=geo:10m rate=6r/s;
    limit_req_status 429;

    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;
    proxy_connect_timeout 10s;
    proxy_read_timeout 45s;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 20s;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    proxy_set_header Connection "";

    map $sent_http_content_type $csp {
        default "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.google-analytics.com https://*.googletagmanager.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; worker-src 'self' blob:; media-src 'self' blob:; font-src 'self' data:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'";
    }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
        add_header Content-Security-Policy $csp always;

        # ---------- base map tiles (range requests) ----------
        location /tiles/ {
            alias /usr/share/nginx/tiles/;
            limit_req zone=tiles burst=800 nodelay;
            add_header Cache-Control "public, max-age=86400";
            add_header Access-Control-Allow-Origin "*";
            add_header X-Content-Type-Options "nosniff" always;
        }

        # ---------- live layers written by the worker ----------
        location /live/ {
            alias /usr/share/nginx/live/;
            gzip_static on;
            add_header Cache-Control "public, max-age=30, must-revalidate";
            add_header X-Content-Type-Options "nosniff" always;
            location ~ \.(tmp|gz)$ { return 404; }
        }

        # ---------- DGT camera images and VMS pictograms ----------
        location ~ "^/cam/(\d{1,9})\.jpg$" {
            limit_req zone=cams burst=60 nodelay;
            set $cam $1;
            proxy_set_header Host etraffic.dgt.es;
            proxy_ssl_name etraffic.dgt.es;
            proxy_set_header Cookie "";
            proxy_set_header Referer "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Real-IP "";
            proxy_set_header CF-Connecting-IP "";
            proxy_set_header User-Agent "rutaviva.aminox.dev camera cache (+https://rutaviva.aminox.dev/fuentes/)";
            proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
            proxy_hide_header Set-Cookie;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_cache camcache;
            proxy_cache_key "cam|$cam";
            proxy_cache_valid 200 2m;
            proxy_cache_valid 404 10m;
            proxy_cache_valid any 1m;
            proxy_pass https://dgt/camarasEtraffic/$cam.jpg;
            add_header Cache-Control "public, max-age=60";
            add_header X-Cache $upstream_cache_status always;
            add_header X-Content-Type-Options "nosniff" always;
        }
        location ~ "^/pict/([A-Za-z0-9_-]{1,20})\.png$" {
            limit_req zone=cams burst=40 nodelay;
            set $pict $1;
            proxy_set_header Host etraffic.dgt.es;
            proxy_ssl_name etraffic.dgt.es;
            proxy_set_header Cookie "";
            proxy_set_header Referer "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header User-Agent "rutaviva.aminox.dev (+https://rutaviva.aminox.dev/fuentes/)";
            proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
            proxy_hide_header Set-Cookie;
            proxy_hide_header Cache-Control;
            proxy_cache camcache;
            proxy_cache_key "pict|$pict";
            proxy_cache_valid 200 30d;
            proxy_cache_valid any 10m;
            proxy_pass https://dgt/estaticosEtraffic/Iconografia/pictogramas/$pict.png;
            add_header Cache-Control "public, max-age=604800";
            add_header X-Content-Type-Options "nosniff" always;
        }
        location ~ ^/(cam|pict)/ { return 404; }

        # ---------- worker API ----------
        location /api/ {
            limit_req zone=api burst=40 nodelay;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For "";
            proxy_cache apicache;
            proxy_cache_key "$uri|$args";
            proxy_cache_valid 200 60s;
            proxy_cache_methods GET HEAD;
            proxy_pass http://worker;
        }

        # ---------- routing (Valhalla) ----------
        location = /route/route {
            limit_req zone=route burst=8 nodelay;
            limit_except POST { deny all; }
            client_max_body_size 8k;
            proxy_set_header Host $host;
            proxy_read_timeout 30s;
            proxy_pass http://valhalla/route;
        }
        location /route/ { return 404; }

        # ---------- geocoder (CartoCiudad, IGN) ----------
        location ~ ^/ign/geocoder/(candidates|find|reverseGeocode)$ {
            limit_req zone=geo burst=30 nodelay;
            proxy_set_header Host www.cartociudad.es;
            proxy_ssl_name www.cartociudad.es;
            proxy_set_header Cookie "";
            proxy_set_header Referer "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Real-IP "";
            proxy_set_header CF-Connecting-IP "";
            proxy_set_header User-Agent "rutaviva.aminox.dev geocoder cache (+https://rutaviva.aminox.dev/fuentes/)";
            proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
            proxy_hide_header Set-Cookie;
            proxy_cache geocache;
            proxy_cache_key "$1|$args";
            proxy_cache_valid 200 1d;
            proxy_pass https://cartociudad/geocoder/api/geocoder/$1$is_args$args;
            add_header Cache-Control "public, max-age=3600";
            add_header X-Content-Type-Options "nosniff" always;
        }
        location /ign/ { return 404; }

        # ---------- static site ----------
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }
        location /map/ {
            add_header Cache-Control "public, max-age=2592000";
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }
        location / {
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
            add_header Content-Security-Policy $csp always;
            try_files $uri $uri/ =404;
        }
        error_page 404 /404.html;
        location = /404.html {
            internal;
        }
    }
}
